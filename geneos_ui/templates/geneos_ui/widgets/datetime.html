<span class="gn-datetime" data-gn-datetime="{{ widget.kind }}" data-gn-display="{{ widget.display }}" data-gn-minute-step="{{ widget.minute_step }}"{% if widget.default_time %} data-gn-default-time="{{ widget.default_time }}"{% endif %}{% if widget.invalid_message %} data-gn-invalid-message="{{ widget.invalid_message }}"{% endif %}{% if widget.picker_label %} data-gn-label="{{ widget.picker_label }}"{% endif %}{% if widget.raw %} data-gn-raw="{{ widget.raw }}"{% endif %}><input type="{{ widget.type }}" name="{{ widget.name }}"{% if widget.value != None %} value="{{ widget.value|stringformat:'s' }}"{% endif %}{% include "django/forms/widgets/attrs.html" %}></span>
