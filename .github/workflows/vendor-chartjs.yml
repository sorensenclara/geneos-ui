name: Vendor Chart.js (pinned)
on:
  push:
    branches: [feature/chartjs-opcional]
    paths:
      - '.github/workflows/vendor-chartjs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chartjs-opcional
          persist-credentials: true
      - name: Download Chart.js 4.5.1 UMD from npm CDN
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p geneos_ui/static/geneos_ui/vendor/chartjs
          curl --fail --location --retry 3 --silent --show-error \
            https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js \
            -o geneos_ui/static/geneos_ui/vendor/chartjs/chart.umd.min.js
          test "$(wc -c < geneos_ui/static/geneos_ui/vendor/chartjs/chart.umd.min.js)" -gt 100000
          grep -q 'Chart.js v4.5.1' geneos_ui/static/geneos_ui/vendor/chartjs/chart.umd.min.js
          curl --fail --location --retry 3 --silent --show-error \
            https://cdn.jsdelivr.net/npm/chart.js@4.5.1/LICENSE.md \
            -o geneos_ui/static/geneos_ui/vendor/chartjs/LICENSE.md
          sha256sum geneos_ui/static/geneos_ui/vendor/chartjs/chart.umd.min.js > geneos_ui/static/geneos_ui/vendor/chartjs/SHA256SUMS
      - name: Commit vendored assets to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add geneos_ui/static/geneos_ui/vendor/chartjs/
          if ! git diff --cached --quiet; then
            git commit -m "build(charts): vendor Chart.js 4.5.1 UMD and MIT license"
            git push origin HEAD:feature/chartjs-opcional
          fi
